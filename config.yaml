binance:
  quote_assets: ["USDT"]
  min_24h_volume_usdt: 5000000
  max_symbols_to_analyze: 150
  refresh_symbols_hours: 6
  priority_symbols: ["BTCUSDT", "ETHUSDT", "BNBUSDT", "SOLUSDT", "XRPUSDT"]
  ignored_symbols: []
  newly_listed_symbols: []
  stablecoin_symbols: ["USDTUSDT", "USDCUSDT", "FDUSDUSDT", "TUSDUSDT", "DAIUSDT"]
  watchlist_symbols: []
  monitoring_mode: "high_volume"

collector:
  enabled: true
  collect_all_active_spot: true
  quote_assets: ["USDT"]
  min_24h_volume_usdt: 0
  max_symbols_per_cycle: 1000
  include_low_data_symbols: true
  interval_minutes: 30
  fetch_candles: "auto"
  candle_min_24h_volume_usdt: 5000000
  max_candle_symbols_per_cycle: 120
  candle_interval: "15m"
  candle_limit: 500

automation:
  enabled: true
  collect_market_data: true
  scan_market: true
  auto_train_ml: true
  ml_train_interval_minutes: 60
  ml_retrain_new_labels: 100
  learning_report_interval_minutes: 60
  status_interval_minutes: 10
  health_check_interval_seconds: 300

backtest:
  enabled: true
  default_timeframe: "15m"
  default_days: 30
  lookback_candles: 220
  max_symbols: 50
  horizons: ["1h", "4h", "24h"]
  auto_run: true
  interval_hours: 24

coin_alerts:
  enabled: true
  default_quote: "USDT"
  interval_seconds: 300
  cooldown_minutes: 30
  preferred_interval_seconds: 180
  preferred_cooldown_minutes: 15
  candle_interval: "15m"
  candle_limit: 96
  surge_24h_pct: 10
  dump_24h_pct: -8
  surge_1h_pct: 4
  dump_1h_pct: -4
  volume_spike_ratio: 2.0
  near_high_pct: 2.0
  high_risk_pump_pct: 20
  watchlist_auto_alerts: true
  preferred_auto_alerts: true

news:
  enabled: true
  sources:
    - name: "CoinDesk"
      url: "https://www.coindesk.com/arc/outboundfeeds/rss/"
    - name: "Cointelegraph"
      url: "https://cointelegraph.com/rss.xml"
  interval_minutes: 15
  lookback_hours_on_prefer: 72
  max_news_per_coin_on_add: 3
  importance_threshold: 70
  per_symbol_cooldown_minutes: 60
  max_news_alerts_per_hour: 6
  ml_breakout_probability_threshold: 0.65

scanner:
  scan_interval_seconds: 30
  buy_score_threshold: 70
  sell_score_threshold: 70
  high_risk_threshold: 65
  cooldown_minutes: 30
  timeframes: ["5m", "15m", "1h", "4h", "1d"]
  selected_symbol_kline_streams: false

ai:
  enabled: true
  provider: "lmstudio"
  base_url: "http://localhost:1234/v1"
  model: "qwen/qwen3.5-9b"
  temperature: 0.2
  max_tokens: 500
  timeout_seconds: 15
  reasoning_effort: "none"
  analysis_reasoning_effort: "none"
  analysis_max_tokens: 300
  analysis_timeout_seconds: 3

knowledge:
  folder: "./knowledge"
  vector_db: "./data/vector_db"
  rebuild_on_start: false
  chunk_size: 1200
  chunk_overlap: 160
  top_k: 5

learning:
  enabled: true
  min_samples_before_weight_change: 30
  weight_update_strength: 0.05
  track_after_minutes: [15, 60, 240, 1440, 10080]
  auto_adjust_weights: true
  manual_feedback_enabled: true
  performance_thresholds:
    buy_win_pct: 2.5
    buy_loss_pct: -1.5
    sell_win_pct: 2.0
    sell_loss_pct: -2.0
    high_risk_win_pct: 3.0
    high_risk_loss_pct: -3.0
    neutral_after_minutes: 240

ml:
  enabled: true
  min_training_samples: 30
  sample_warning_threshold: 200
  min_positive_samples_warning: 30
  random_forest_min_samples: 200
  test_size: 0.25
  model_path: "./models/latest_model.pkl"
  training_examples_min_confidence: 0
  auto_label_after_minutes: 240

notifications:
  telegram_enabled: true
  desktop_enabled: false
  email_enabled: false
  discord_enabled: false

  notify_buy: true
  notify_sell: true
  notify_hold: false
  notify_wait: false
  notify_avoid: false
  notify_high_risk: true

  max_alerts_per_hour: 20
  only_strong_signals: false
  notify_startup: true
  notify_errors: true

  quiet_hours:
    enabled: false
    start: "22:00"
    end: "07:00"

telegram:
  bot_token_env: "TELEGRAM_BOT_TOKEN"
  chat_id_env: "TELEGRAM_CHAT_ID"

email:
  user_env: "EMAIL_USER"
  password_env: "EMAIL_PASSWORD"
  to: ""
  smtp_host: "smtp.gmail.com"
  smtp_port: 587

discord:
  webhook_env: "DISCORD_WEBHOOK_URL"

storage:
  sqlite_path: "./data/cryptoradar.db"

telegram_formatting:
  use_template_formatter: true
  max_message_chars: 1200
  style: "clean_professional"
  include_emojis: true
  include_key_levels: true
  include_risk_note: true
