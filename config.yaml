binance:
  quote_assets: ["USDT"]
  min_24h_volume_usdt: 5000000
  max_symbols_to_analyze: 150
  refresh_symbols_hours: 6
  priority_symbols: ["BTCUSDT", "ETHUSDT", "BNBUSDT", "SOLUSDT", "XRPUSDT"]
  ignored_symbols: []
  newly_listed_symbols: []
  stablecoin_symbols: ["USDTUSDT", "USDCUSDT", "FDUSDUSDT", "TUSDUSDT", "DAIUSDT"]
  watchlist_symbols: []
  monitoring_mode: "high_volume"

scanner:
  scan_interval_seconds: 30
  buy_score_threshold: 70
  sell_score_threshold: 70
  high_risk_threshold: 65
  cooldown_minutes: 30
  timeframes: ["5m", "15m", "1h", "4h", "1d"]
  selected_symbol_kline_streams: false

ai:
  enabled: true
  provider: "lmstudio"
  base_url: "http://localhost:1234/v1"
  model: "qwen/qwen3.5-9b"
  temperature: 0.2
  max_tokens: 500
  timeout_seconds: 15
  reasoning_effort: "none"
  analysis_reasoning_effort: "medium"
  analysis_max_tokens: 1200
  analysis_timeout_seconds: 45

knowledge:
  folder: "./knowledge"
  vector_db: "./data/vector_db"
  rebuild_on_start: false
  chunk_size: 1200
  chunk_overlap: 160
  top_k: 5

learning:
  enabled: true
  min_samples_before_weight_change: 30
  weight_update_strength: 0.05
  track_after_minutes: [15, 60, 240, 1440, 10080]
  auto_adjust_weights: true
  manual_feedback_enabled: true

notifications:
  telegram_enabled: true
  desktop_enabled: false
  email_enabled: false
  discord_enabled: false

  notify_buy: true
  notify_sell: true
  notify_hold: false
  notify_wait: false
  notify_avoid: false
  notify_high_risk: true

  max_alerts_per_hour: 20
  only_strong_signals: false
  notify_startup: true
  notify_errors: true

  quiet_hours:
    enabled: false
    start: "22:00"
    end: "07:00"

telegram:
  bot_token_env: "TELEGRAM_BOT_TOKEN"
  chat_id_env: "TELEGRAM_CHAT_ID"

email:
  user_env: "EMAIL_USER"
  password_env: "EMAIL_PASSWORD"
  to: ""
  smtp_host: "smtp.gmail.com"
  smtp_port: 587

discord:
  webhook_env: "DISCORD_WEBHOOK_URL"

storage:
  sqlite_path: "./data/cryptoradar.sqlite3"

telegram_formatting:
  use_template_formatter: true
  max_message_chars: 1200
  style: "clean_professional"
  include_emojis: true
  include_key_levels: true
  include_risk_note: true
